[project]
name = "el-xref"
version = "0.1.0"
description = "Map EELS spec functions to their counterparts in every execution client"
readme = "README.md"
authors = [
    { name = "spencer-tb", email = "spencer.tb@ethereum.org" }
]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.22.1",
]

[project.scripts]
el-xref = "el_xref.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# ruff, mypy and pytest are set up once, in the workspace root.
