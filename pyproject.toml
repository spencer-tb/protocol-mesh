[project]
name = "protocol-mesh"
version = "0.1.0"
description = "One place for the tooling our agents and teams use to build EIPs together."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.mypy]
strict = true
files = ["bootstrap.py", "tests"]
