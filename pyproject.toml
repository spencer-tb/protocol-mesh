[project]
name = "protocol-mesh"
version = "0.1.0"
description = "One place for the tooling our agents and teams use to build EIPs together."
requires-python = ">=3.12"
dependencies = []

# The groups, pins and tool settings below follow execution-specs, so code
# reads and lints the same in both repos.
[dependency-groups]
test = [
    "pytest>=8,<9",
    "el-xref",
]
lint = [
    "mypy==2.1.0",
    "ruff==0.13.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
package = false
required-version = ">=0.13.4"

[tool.uv.workspace]
members = ["xref"]

[tool.uv.sources]
el-xref = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "xref/tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "B", # flake8-bugbear
    "W", # pycodestyle warnings
    "I", # isort
    "A", # flake8-builtins
    "N", # pep8-naming
    "D", # pydocstyle
    "C4", # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
fixable = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "B", # flake8-bugbear
    "W", # pycodestyle warnings
    "I", # isort
    "D", # pydocstyle
]
ignore = [
    "C401", # Unnecessary generator set
    "C408", # Unnecessary collection call
    "D107", # Missing docstring in __init__
    "D200", # One-line docstring should fit on one line with quotes
    "D203", # 1 blank line required before class docstring
    "D205", # Missing blank line after summary
    "D212", # Multi-line docstring summary should start at the first line
    "D401", # First line should be in imperative mood ("Do", not "Does")
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
"xref/tests/*" = ["ARG001"]

[tool.mypy]
strict = true
files = ["bootstrap.py", "latest.py", "tests", "xref/src", "xref/tests", "fuzz"]

[[tool.mypy.overrides]]
# fuzz/eels_side.py runs inside an execution-specs checkout, which provides
# these.
module = ["ethereum.*", "ethereum_types.*"]
ignore_missing_imports = true
